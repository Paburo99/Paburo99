name: Refresh profile activity
on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
  push:
    branches: [main]
    paths:
      - .github/update-activity.mjs
      - .github/workflows/profile.yml
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/update-activity.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node .github/update-activity.mjs --check
      - name: Commit activity graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg assets/activity-mobile.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile activity'
            git push
          fi
